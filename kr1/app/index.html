<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Список задач</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Arial, sans-serif; max-width: 560px; margin: 32px auto; color: #222; }
    h1 { font-size: 22px; }
    .filters button { padding: 6px 14px; margin-right: 6px; border: 1px solid #888; background: #fff; border-radius: 6px; cursor: pointer; }
    .filters button.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    ul { list-style: none; padding: 0; }
    li { padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; margin: 8px 0; }
    li.done span { text-decoration: line-through; color: #888; }
    .summary { background: #f3f4f6; padding: 12px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Список задач</h1>
  <div class="filters">
    <button data-filter="all">Все</button>
    <button data-filter="pending">В работе</button>
    <button data-filter="done">Выполненные</button>
  </div>
  <ul id="task-list"></ul>
  <div class="summary" id="summary"></div>

  <script src="../tasks.js"></script>
  <script src="app.js"></script>
</body>
</html>
